(function() {
  // Function to set or update viewport meta tag
  function ensureViewportMeta() {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    
    if (!viewportMeta) {
      // Create viewport meta tag if it doesn't exist
      viewportMeta = document.createElement('meta');
      viewportMeta.name = 'viewport';
      document.head.insertBefore(viewportMeta, document.head.firstChild);
    }
    
    // Set viewport to prevent iOS auto-zoom
    viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureViewportMeta);
  } else {
    ensureViewportMeta();
  }
  
  if (!document.head) {
    var observer = new MutationObserver(function(mutations) {
      if (document.head) {
        ensureViewportMeta();
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true });
  }
})();

<script>
// Unified event listener patch:
// - click -> pointerup conversion (preserves removeEventListener)
// - force passive: true for touchstart/touchmove by default (unless explicitly passive:false)
// - capture devicemotion listeners to allow synthetic events from parent
(function(){
  var nativeAdd = EventTarget.prototype.addEventListener;
  var nativeRemove = EventTarget.prototype.removeEventListener;
  var listenerMap = new WeakMap(); // element -> Map(original -> wrapper)
  var deviceMotionListeners = [];

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    var newOptions = options;
    // Force passive for touchstart/touchmove unless explicitly passive:false
    if ((type === 'touchstart' || type === 'touchmove') && !(options && options.passive === false)) {
      if (typeof options === 'boolean' || options === undefined) {
        newOptions = { passive: true, capture: !!options };
      } else {
        newOptions = Object.assign({}, options, { passive: true });
      }
    }

    // Convert click listeners to pointerup for better iOS behavior
    if (type === 'click' && typeof listener === 'function') {
      var map = listenerMap.get(this);
      if (!map) { map = new Map(); listenerMap.set(this, map); }
      var existing = map.get(listener);
      if (existing) return nativeAdd.call(this, 'pointerup', existing, newOptions);

      var wrapper = function(e) {
        if (typeof e.button !== 'undefined' && e.button !== 0) return;
        try { listener.call(this, e); } catch (err) { console.error('[Click->Pointer wrapper] error', err); }
      };
      map.set(listener, wrapper);
      return nativeAdd.call(this, 'pointerup', wrapper, newOptions);
    }

    // Capture devicemotion listeners so we can forward synthetic events
    if (type === 'devicemotion' && typeof listener === 'function') {
      deviceMotionListeners.push(listener);
      return nativeAdd.call(this, type, listener, newOptions);
    }

    return nativeAdd.call(this, type, listener, newOptions);
  };

  EventTarget.prototype.removeEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var map = listenerMap.get(this);
      if (map) {
        var wrapper = map.get(listener);
        if (wrapper) { map.delete(listener); return nativeRemove.call(this, 'pointerup', wrapper, options); }
      }
    }

    if (type === 'devicemotion' && typeof listener === 'function') {
      var idx = deviceMotionListeners.indexOf(listener);
      if (idx !== -1) deviceMotionListeners.splice(idx, 1);
    }

    return nativeRemove.call(this, type, listener, options);
  };

  // Listen for forwarded motion data from parent and dispatch to captured listeners
  window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== '__sekai_device_motion__') return;
    var data = event.data;
    var syntheticEvent = {
      accelerationIncludingGravity: data.accelerationIncludingGravity,
      acceleration: data.acceleration,
      rotationRate: data.rotationRate,
      interval: data.interval || 16,
      type: 'devicemotion',
      timeStamp: data.timestamp || Date.now(),
      target: window,
      currentTarget: window,
      preventDefault: function(){},
      stopPropagation: function(){},
      stopImmediatePropagation: function(){}
    };
    deviceMotionListeners.forEach(function(listener){ try { listener(syntheticEvent); } catch(e) {} });
  });

  console.log('[Unified Patch] addEventListener installed');
})();
</script>

<script>
(function() {
  // Track if dom_ready was already sent
  var domReadySent = false;

  function sendDomReady() {
    if (domReadySent) return;
    domReadySent = true;
    window.parent.postMessage({ type: 'sekai_iframe_dom_ready' }, '*');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendDomReady);
  } else {
    sendDomReady();
  }

  function serializeMessage(msg) {
    if (msg === null || msg === undefined) return '';
    if (typeof msg === 'string') return msg;
    if (typeof msg === 'object') {
      try { return JSON.stringify(msg); } catch (e) { return String(msg); }
    }
    return String(msg);
  }

  window.onerror = function(message, source, lineno, colno, error) {
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: serializeMessage(message),
      source: source || '',
      lineno: lineno || 0,
      colno: colno || 0,
      errorName: error ? error.name : '',
      errorStack: error ? error.stack : ''
    }, '*');
    return false;
  };

  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var isError = reason instanceof Error;
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: reason ? serializeMessage(reason) : 'Unhandled promise rejection',
      source: 'unhandledrejection',
      lineno: 0,
      colno: 0,
      errorName: isError ? reason.name : '',
      errorStack: isError ? reason.stack : ''
    }, '*');
  });
})();

<script>
(function() {
  // Track all AudioContexts created in this iframe
  var audioContexts = [];
  var originalAudioContext = window.AudioContext || window.webkitAudioContext;

  if (originalAudioContext) {
    var PatchedAudioContext = function() {
      var ctx = new originalAudioContext();
      audioContexts.push(ctx);
      return ctx;
    };
    PatchedAudioContext.prototype = originalAudioContext.prototype;
    window.AudioContext = PatchedAudioContext;
    if (window.webkitAudioContext) { window.webkitAudioContext = PatchedAudioContext; }
  }

  var audioElements = [];
  var originalAudio = window.Audio;
  if (originalAudio) {
    window.Audio = function(src) { var audio = new originalAudio(src); audioElements.push(audio); return audio; };
    window.Audio.prototype = originalAudio.prototype;
  }

  var videoElements = [];
  var originalCreateElement = document.createElement;
  document.createElement = function(tagName) {
    var element = originalCreateElement.call(document, tagName);
    if (typeof tagName === 'string') {
      var tag = tagName.toLowerCase();
      if (tag === 'audio') audioElements.push(element);
      else if (tag === 'video') videoElements.push(element);
    }
    return element;
  };

  var mutedElements = new WeakMap();
  var isMuted = false;

  function muteAllAudio() {
    if (isMuted) return; isMuted = true;
    audioContexts.forEach(function(ctx) { if (ctx && ctx.state === 'running') ctx.suspend().catch(function(){}); });
    var mediaElements = document.querySelectorAll('audio, video');
    mediaElements.forEach(function(el) { mutedElements.set(el, el.muted); el.muted = true; });
    audioElements.forEach(function(audio) { try { if (!mutedElements.has(audio)) mutedElements.set(audio, audio.muted); audio.muted = true; } catch(e) {} });
    videoElements.forEach(function(video) { try { if (!mutedElements.has(video)) mutedElements.set(video, video.muted); video.muted = true; } catch(e) {} });
  }

  function unmuteAllAudio() {
    if (!isMuted) return; isMuted = false;
    audioContexts.forEach(function(ctx) { if (ctx && ctx.state === 'suspended') ctx.resume().catch(function(){}); });
    var mediaElements = document.querySelectorAll('audio, video');
    mediaElements.forEach(function(el) { var wasMuted = mutedElements.get(el); if (wasMuted !== undefined) el.muted = wasMuted; else el.muted = false; });
    audioElements.forEach(function(audio) { try { var wasMuted = mutedElements.get(audio); if (wasMuted !== undefined) audio.muted = wasMuted; else audio.muted = false; } catch(e) {} });
    videoElements.forEach(function(video) { try { var wasMuted = mutedElements.get(video); if (wasMuted !== undefined) video.muted = wasMuted; else video.muted = false; } catch(e) {} });
  }

  window.addEventListener('message', function(event) {
    if (!event.data) return;
    if (event.data.type === 'receive_audio_mute' || (event.data.origin === 'sekai_gaming_iframe_api' && event.data.type === 'receive_audio_mute')) muteAllAudio();
    if (event.data.type === 'receive_audio_unmute' || (event.data.origin === 'sekai_gaming_iframe_api' && event.data.type === 'receive_audio_unmute')) unmuteAllAudio();
  });
})();

  document.head.appendChild(style);

  var scrollableTarget = null;
  function findScrollableAncestor(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      var cs = window.getComputedStyle(el);
      if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) return el;
      el = el.parentElement;
    }
    return null;
  }

  document.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) { scrollableTarget = null; return; }
    scrollableTarget = findScrollableAncestor(e.target);
    if (scrollableTarget) scrollableTarget.style.touchAction = 'pan-y';
  }, { passive: true, capture: true });

  document.addEventListener('touchend', function(e) { if (scrollableTarget) { scrollableTarget.style.touchAction = ''; scrollableTarget = null; } }, { passive: true, capture: true });

  document.addEventListener('focusin', function(e) { var t = e.target; if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) window.parent.postMessage({ type: 'iframe-focusin' }, '*'); }, true);

<script>
(function() {
  var touchStartY = null;
  var lastSentTime = 0;
  var SWIPE_THRESHOLD = 100;
  var DEBOUNCE_MS = 500;
  document.addEventListener('touchstart', function(e) { if (e.touches.length === 1) touchStartY = e.touches[0].clientY; }, { passive: true, capture: true });
  document.addEventListener('touchend', function(e) {
    if (touchStartY !== null && e.changedTouches.length === 1) {
      var now = Date.now();
      var deltaY = touchStartY - e.changedTouches[0].clientY;
      var timeSinceLast = now - lastSentTime;
      if (deltaY >= SWIPE_THRESHOLD && timeSinceLast >= DEBOUNCE_MS) {
        lastSentTime = now;
        window.parent.postMessage({ type: 'sekai_iframe_swipe_up', deltaY: deltaY, timestamp: now }, '*');
      }
    }
    touchStartY = null;
  }, { passive: true, capture: true });
  document.addEventListener('touchcancel', function() { touchStartY = null; }, { passive: true, capture: true });
})();
</script>
